const sizeSort=(a,b)=>{const x=parseFloat(a),y=parseFloat(b);if(isFinite(x)&&isFinite(y))return x-y;const o=["XS","S","M","L","XL","XXL","XXXL"];return (o.indexOf(a)-o.indexOf(b))||a.localeCompare(b)};
const catOf=it=>it.cat||"shoes";
const C=k=>CATS.find(c=>c.k===k);
const hash=s=>[...s].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7);
const bc=b=>{const k=b.toLowerCase();return BRANDC[k]||"p"+(1+hash(k)%6)};
const bvars=b=>`--bc:var(--${bc(b)});--bs:var(--${bc(b)}s)`;
const mvars=(b,m)=>{const pool=["p1","p2","p3","p4","p5","p6"].filter(p=>p!==bc(b));const models=uniq(inCat(S.cat).filter(i=>i.brand===b).map(i=>i.model)).sort();
  const p=pool[Math.max(0,models.indexOf(m))%pool.length];return `--mc:var(--${p})`};
const SWATCH={black:"#16181b",white:"#ffffff",gray:"#9aa0a6",grey:"#9aa0a6",silver:"#c3c8ce",green:"#2e9e5b",red:"#d6332b",blue:"#2f6fe0",navy:"#1f2f5c",brown:"#7a4a2a",beige:"#dcc8a6",cream:"#f3e9d2",pink:"#f19bbf",yellow:"#f2c230",orange:"#f08a24",purple:"#7d4cc9",gold:"#d4a72c",tan:"#c8a27a",olive:"#707a3a",khaki:"#b9a76b",maroon:"#6d1f2b",teal:"#1a9a8a",burgundy:"#7a1f35",mint:"#9fe0c4",sky:"#8cc8f2",lilac:"#c4a8e6",chocolate:"#5a3520",bone:"#ece4d4",sand:"#d8c39a",lime:"#9ccc33",coral:"#f07a5a"};
const swatches=name=>{const w=uniq((name.toLowerCase().match(/[a-z]+/g)||[]).filter(x=>SWATCH[x])).slice(0,3);
  return w.length?`<span class="sw">${w.map(x=>`<i style="background:${SWATCH[x]}"></i>`).join("")}</span>`:""};
const toast=m=>{const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)};
const all=()=>Object.entries(items).map(([id,it])=>({id,...it}));
const ordId=it=>it.order||("d-"+catOf(it));
const STL={draft:"Draft",sent:"Sent",received:"Received"},STN=["draft","sent","received"],STC={draft:"var(--p4)",sent:"var(--p5)",received:"var(--p3)"};
function ordersOf(k){
  const l=Object.entries(ords).filter(([,o])=>o.cat===k).map(([id,o])=>({id,...o}));
  if(!ords["d-"+k]&&all().some(i=>catOf(i)===k&&ordId(i)==="d-"+k))l.push({id:"d-"+k,cat:k,name:"Order 1",created:0,status:"draft",virtual:true});
  return l.sort((a,b)=>(a.created||0)-(b.created||0));
}
const curOrder=()=>ordersOf(S.cat).find(o=>o.id===S.oid)||null;
const inCatAll=k=>all().filter(i=>catOf(i)===k);
const inCat=k=>all().filter(i=>catOf(i)===k&&ordId(i)===S.oid).sort((a,b)=>a.brand.localeCompare(b.brand)||a.model.localeCompare(b.model)||a.name.localeCompare(b.name));
const uniq=a=>[...new Set(a)];
const unitFor=(c,q)=>c.unit==="pairs"?(q===1?"pair":"pairs"):(q===1?"pc":"pcs");
const sizeChip=(c,k,q)=>`<span class="sz" title="${esc(k)}: ${q} ${unitFor(c,q)}"><b>${esc(k)}</b><span>${q}</span></span>`;
/* photos: migrated ones are files in orderlist-photos/, new ones are Cloudinary links */
const photoUrl=id=>/^(https?:|data:)/.test(id)?id:"orderlist-photos/"+id+".jpg";
const picHTML=it=>it.photo
  ?`<button class="pic" data-view="${it.id}" aria-label="View photo"><img src="${esc(photoUrl(it.photo))}" alt="${esc(it.name)}" loading="lazy" onerror="this.remove()"></button>`
  :`<span class="pic" aria-label="Add photo">${ICONS.photo}<span class="plus">+</span><input type="file" accept="image/*" data-photo-input="${it.id}" aria-label="Add photo for ${esc(it.name)}"></span>`;

function vCat(){

  <div class="stats">

    <button class="stat" style="--sb:var(--p3s);--sc:var(--p3)" data-panel="models" aria-expanded="${S.panel==="models"}"><div><div class="label">Models</div><div class="v">${models.length}</div></div><span class="chev">›</span></button>
    <button class="stat" style="--sb:var(--p1s);--sc:var(--p1)" data-panel="qty" aria-expanded="${S.panel==="qty"}"><div><div class="label">${c.unit==="pairs"?"Pairs":"Pieces"}</div><div class="v">${s.q}</div></div><span class="chev">›</span></button>
    <div class="stat amount"><div><div class="label">Amount</div><div class="v">${money(s.a)}</div></div></div>
  </div>`;

      return `<button class="prow" style="${bvars(b)}" data-detail-brand="${esc(b)}"><span class="pname"><span class="dot"></span><span>${esc(b)}<small>${uniq(bl.map(i=>i.model)).length} models</small></span></span><span class="pval"><b>${bs.q}</b> ${c.unit} · <b>${money(bs.a)}</b> ›</span></button>`}).join(""):'<div class="empty">No brands yet</div>'}</div>`;

  if(S.panel==="qty"){

    const keys=Object.keys(tot).sort(sizeSort);

    h+=`<div class="panel" style="--cc:var(--${c.c});--cs:var(--${c.c}s)">${keys.length?`<div class="sizechips">${keys.map(k=>`<div class="schip"><b>${esc(k)}</b><span>${tot[k]} ${unitFor(c,tot[k])}</span></div>`).join("")}</div>`:'<div class="empty">No sizes entered yet</div>'}
      <div class="prow" style="--bc:var(--p3)"><span class="pname"><span class="dot"></span>Made in Vietnam</span><span class="pval"><b>${vn.q}</b> ${c.unit} · <b>${money(vn.a)}</b></span></div>
      <div class="prow" style="--bc:var(--p6)"><span class="pname"><span class="dot"></span>Made in China</span><span class="pval"><b>${cn.q}</b> ${c.unit} · <b>${money(cn.a)}</b></span></div></div>`;
  }

      for(const it of ml){
        const sz=Object.keys(it.sizes||{}).filter(k=>n(it.sizes[k])).sort(sizeSort);

        h+=`<div class="item" data-row="${it.id}"><div class="icard">${picHTML(it)}<div class="icol">

            <span class="isub"><span class="calc">${qtyOf(it)} ${c.unit} × QAR ${fmt(n(it.price))}</span><span class="ed">${S.open===it.id?"Close":"Edit"}</span></span>

          <button class="szbtn" data-open="${it.id}" aria-label="Edit sizes"><span class="szs">${sz.length?sz.map(k=>sizeChip(c,k,n(it.sizes[k]))).join(""):'<span class="note">Tap to add sizes</span>'}</span></button></div></div>
          ${S.open===it.id?editor(it,c):""}</div>`;

function render(){
  const ae=document.activeElement,aid=ae&&ae.id,sel=ae&&ae.selectionStart!=null?[ae.selectionStart,ae.selectionEnd]:null;

/* ---------- storage: saved inside the New Rima app data (parent window) ---------- */
function persistAll(){try{parent.nrOLSave(items,ords)}catch(e){toast("Couldn't save. Reload the app.")}}
function persistLocal(){persistAll()}
function persistOrds(){persistAll()}
function scheduleSave(id,delay=600){clearTimeout(timers[id]);dirty[id]=true;timers[id]=setTimeout(()=>save(id),delay)}
async function saveOrder(id){const o=ords[id];if(!o)return;persistAll()}
async function newOrder(cat,name){const id="o"+Date.now().toString(36);ords[id]={cat,name,created:Date.now(),status:"draft"};await saveOrder(id);return id}
const newestOrder=k=>{const l=ordersOf(k);return l.length?l[l.length-1].id:null};
function catalogOf(k){
  const key=i=>[i.brand,i.model,i.name].map(x=>String(x||"").trim().toLowerCase().replace(/\s+/g," ")).join("|");
  const best={};
  for(const i of inCatAll(k)){const kk=key(i),b=best[kk];
    if(!b||(!b.photo&&i.photo)||((!!b.photo===!!i.photo)&&(i.created||0)>(b.created||0)))best[kk]=i}
  return Object.values(best);
}

async function shrink(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const max=640,sc=Math.min(1,max/Math.max(img.width,img.height));
    const cv=document.createElement("canvas");cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
    const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);
    return await new Promise(res=>cv.toBlob(b=>res(b||file),"image/jpeg",.82))}
  finally{URL.revokeObjectURL(url)}
}

  if(!g.q){toast("No quantities entered yet");return}
  out.push(`GRAND TOTAL: ${g.q} ${c.unit} · ${money(g.a)}`);const text=out.join("\n");
  try{await navigator.clipboard.writeText(text);toast("Order copied")}
  catch(e){S.copy=text;render();const b=$("copyBox");if(b){b.focus();b.select()}}
}

/* ---------- boot: load from the New Rima app data (first time: seed from the old Order List) ---------- */
(async()=>{
  let d=null;try{d=parent.nrOLLoad()}catch(e){}
  if(!d||!d.items){
    try{const r=await fetch("orderlist-seed.json");d=await r.json();items=d.items||{};ords=d.orders||{};persistAll()}catch(e){items={};ords={}}
  }else{items=d.items||{};ords=d.orders||{}}
  render();
})();
</script>
